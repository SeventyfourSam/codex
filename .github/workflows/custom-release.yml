name: Custom release
run-name: Custom release - ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'check upstream' }}

# Push vX.Y.Z-custom or vX.Y.Z-custom.N to build and publish a release.
on:
  # Every six hours: 05:17, 11:17, 17:17, and 23:17 in Asia/Singapore.
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to rebuild; leave empty to check official stable updates"
        required: false
        type: string
  push:
    tags:
      - "v*-custom"
      - "v*-custom.*"

permissions:
  contents: read

concurrency:
  # A tag's short dispatch run must not hold the actual build's concurrency slot.
  group: custom-release-${{ github.event_name == 'push' && format('dispatch-{0}', github.ref_name) || inputs.release_tag || 'sync' }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'SeventyfourSam/codex' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start release on custom to share caches between tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom(\.(0|[1-9][0-9]*))?$ ]]; then
            echo 'Invalid custom release tag' >&2
            exit 1
          fi
          # SSH pushes emit tag events. The upstream sync already builds its tag.
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object | [.type, .sha] | @tsv')
          read -r tag_type tag_sha <<< "$tag_object"
          if [[ "$tag_type" == tag ]]; then
            tag_message=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.message')
            if [[ "$tag_message" == "Merge official "*"; retain custom revision "* ]]; then
              echo "Upstream sync builds $RELEASE_TAG in its own run; skipping duplicate dispatch." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          gh workflow run custom-release.yml --repo "$GITHUB_REPOSITORY" \
            --ref custom --field "release_tag=$RELEASE_TAG"
          echo "Dispatched $RELEASE_TAG to custom; follow the workflow_dispatch run for build results." >> "$GITHUB_STEP_SUMMARY"

  prepare:
    if: github.repository == 'SeventyfourSam/codex' && github.ref == 'refs/heads/custom' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    # Source-based protocol regeneration may compile its Rust generator once.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag || steps.sync.outputs.release_tag }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Verify upstream push credential
        if: inputs.release_tag == ''
        env:
          CUSTOM_UPSTREAM_SSH_KEY: ${{ secrets.CUSTOM_UPSTREAM_SSH_KEY }}
        run: |
          if [[ -z "$CUSTOM_UPSTREAM_SSH_KEY" ]]; then
            echo '::error::Configure CUSTOM_UPSTREAM_SSH_KEY and a write-enabled repository deploy key before automatic upgrades.'
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: custom
          fetch-depth: 0
          # Only automatic upgrades need write access, including workflow files.
          ssh-key: ${{ inputs.release_tag == '' && secrets.CUSTOM_UPSTREAM_SSH_KEY || '' }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Test merge and release helpers
        run: |
          python -m unittest discover -s .github/scripts -p test_merge_custom_upstream.py
          python -m unittest discover -s .github/scripts -p test_custom_release_dispatch.py
          python -m unittest discover -s .github/scripts -p test_custom_source_policy.py
          python -m unittest discover -s .github/scripts -p test_custom_compat.py

      - name: Test Unix updater fixtures without network
        run: python -m unittest discover -s scripts/install -p test_custom_update.py

      - name: Test Windows updater fixtures without network
        shell: pwsh
        run: ./scripts/install/test_custom_update.ps1

      - name: Install schema generation tools
        if: inputs.release_tag == ''
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just,cargo-nextest

      - name: Install Python SDK generation tools
        if: inputs.release_tag == ''
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Linux CLI check dependencies
        if: inputs.release_tag == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev

      - name: Cache protocol generator dependencies and builds
        if: inputs.release_tag == ''
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: custom-schema-v1-${{ runner.os }}-${{ hashFiles('codex-rs/rust-toolchain.toml', 'codex-rs/.cargo/config.toml', 'codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            custom-schema-v1-${{ runner.os }}-

      - name: Select explicitly requested tag
        id: tag
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom(\.(0|[1-9][0-9]*))?$ ]]; then
            echo 'Invalid custom release tag' >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Merge latest stable and preserve custom revision
        id: sync
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.tag.outputs.release_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/scripts/sync_custom_release.py

      - name: Pin the release commit
        id: commit
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag || steps.sync.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then exit 0; fi
          release_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$release_sha" HEAD
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Report merge conflicts
        if: failure()
        run: |
          {
            echo '### Preparation failed; see the failed step for details'
            conflicts=$(git diff --name-only --diff-filter=U)
            if [[ -n "$conflicts" ]]; then
              echo 'Only these files need manual conflict resolution:'
              echo '```text'
              printf '%s\n' "$conflicts"
              echo '```'
            else
              echo 'No unresolved merge conflicts; inspect the failed step above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.release_tag != ''
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            jobs: "2"
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
            jobs: "4"
    defaults:
      run:
        shell: bash
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Keep release optimizations while reducing build and archive disk usage.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      TARGET: ${{ matrix.target }}
      ARCHIVE_FORMAT: ${{ matrix.archive }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Test macOS installer without network
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts/install -p 'test_custom_*.py'

      - name: Test Windows installer and updater fixtures without network
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($test in @('test_custom_install_platform.ps1', 'test_custom_update.ps1')) {
            & (Get-Process -Id $PID).Path -NoProfile -File "./scripts/install/$test"
            if ($LASTEXITCODE -ne 0) { throw "$test failed." }
          }

      - name: Test Windows PowerShell 5.1 installer and updater fixtures without network
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($test in @('test_custom_install_platform.ps1', 'test_custom_update.ps1')) {
            & (Get-Process -Id $PID).Path -NoProfile -File "./scripts/install/$test"
            if ($LASTEXITCODE -ne 0) { throw "$test failed." }
          }

      - name: Validate release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+)-custom(?:\.(0|[1-9][0-9]*))?", tag)
          if match is None:
              raise SystemExit("Expected vX.Y.Z-custom or vX.Y.Z-custom.N")
          cargo = tomllib.loads(Path("codex-rs/Cargo.toml").read_text())
          version = cargo["workspace"]["package"]["version"]
          if match[1] != version:
              raise SystemExit(f"Tag base version {match[1]} differs from Cargo version {version}")
          toolchain = tomllib.loads(Path("codex-rs/rust-toolchain.toml").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"toolchain={toolchain['toolchain']['channel']}\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CODEX_CUSTOM_REVISION={match[2] or ''}\n")
              output.write(f"UPSTREAM_VERSION={version}\n")
              output.write(f"CUSTOM_VERSION={tag[1:]}\n")
          PY

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: ${{ steps.version.outputs.toolchain }}
          targets: ${{ matrix.target }}

      - name: Restore dependency downloads
        id: downloads
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codex-package
          key: custom-release-${{ matrix.target }}-${{ hashFiles('codex-rs/Cargo.lock', 'third_party/v8/*release_manifests.sha256', 'scripts/codex_package/rg', 'scripts/codex_package/codex-zsh') }}
          restore-keys: custom-release-${{ matrix.target }}-

      - name: Restore compiled Rust artifacts
        id: compiled
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: codex-rs/target
          # Key build settings independently of scheduling and validation steps.
          # Bump v2 when changing build behavior not covered by Cargo fingerprints.
          key: custom-compiled-v2-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.version.outputs.toolchain }}-${{ env.CARGO_PROFILE_RELEASE_DEBUG }}-${{ env.CARGO_PROFILE_RELEASE_STRIP }}-${{ hashFiles('codex-rs/.cargo/config.toml') }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ needs.prepare.outputs.release_sha }}
          restore-keys: |
            custom-compiled-v2-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.version.outputs.toolchain }}-${{ env.CARGO_PROFILE_RELEASE_DEBUG }}-${{ env.CARGO_PROFILE_RELEASE_STRIP }}-${{ hashFiles('codex-rs/.cargo/config.toml') }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
            custom-compiled-v2-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.version.outputs.toolchain }}-${{ env.CARGO_PROFILE_RELEASE_DEBUG }}-${{ env.CARGO_PROFILE_RELEASE_STRIP }}-${{ hashFiles('codex-rs/.cargo/config.toml') }}-
            custom-compiled-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.version.outputs.toolchain }}-

      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Build and package
        env:
          TMPDIR: ${{ runner.temp }}
          COMPILED_CACHE_RESTORED: ${{ steps.compiled.outputs.cache-matched-key != '' }}
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            git config --global core.longpaths true
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          python3 scripts/build_codex_package.py \
            --variant codex \
            --target "$TARGET" \
            --cargo-profile release \
            --package-dir package \
            --archive-output "dist/codex-${CUSTOM_VERSION}-${TARGET}.${ARCHIVE_FORMAT}"
          {
            echo "### $TARGET"
            echo "Compiled cache restored: $COMPILED_CACHE_RESTORED"
            echo "Cargo parallel jobs: $CARGO_BUILD_JOBS"
            echo "Build and package duration: $(( $(date +%s) - started_at )) seconds"
            echo "Compiled artifacts size: $(du -sh codex-rs/target | cut -f 1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Save before package smoke tests so a later validation/upload failure
      # does not discard a successful, expensive compilation.
      - name: Save dependency downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codex-package
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Save compiled Rust artifacts
        if: steps.compiled.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: codex-rs/target
          key: ${{ steps.compiled.outputs.cache-primary-key }}

      - name: Verify extracted package
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path

          archive, = Path("dist").iterdir()
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              if archive.suffix == ".zip":
                  with zipfile.ZipFile(archive) as package:
                      package.extractall(root)
              else:
                  with tarfile.open(archive) as package:
                      package.extractall(root, filter="data")
              suffix = ".exe" if os.name == "nt" else ""
              codex = root / "bin" / f"codex{suffix}"
              for flag, expected in [
                  ("--version", os.environ["UPSTREAM_VERSION"]),
                  ("--custom", os.environ["CUSTOM_VERSION"]),
              ]:
                  actual = subprocess.check_output([codex, flag], text=True, timeout=30).strip()
                  if actual != f"codex-cli {expected}":
                      raise SystemExit(f"Unexpected {flag}: {actual}")
                  print(actual)
              subprocess.run([codex, "--help"], check=True, timeout=30)
              subprocess.run([root / "bin" / f"codex-code-mode-host{suffix}", "--help"], check=True, timeout=30)
              subprocess.run([root / "codex-path" / f"rg{suffix}", "--version"], check=True, timeout=30)
          PY

      - name: Test Windows installer without network
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # -File isolates expected native failures; uncaught test assertions still fail.
          & (Get-Process -Id $PID).Path -NoProfile -File ./scripts/install/test_custom_install.ps1 -Archive "dist/codex-$env:CUSTOM_VERSION-$env:TARGET.zip" -Version "$env:CUSTOM_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed.' }

      - name: Test Windows PowerShell 5.1 installer without network
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # -File isolates expected native failures; uncaught test assertions still fail.
          & (Get-Process -Id $PID).Path -NoProfile -File ./scripts/install/test_custom_install.ps1 -Archive "dist/codex-$env:CUSTOM_VERSION-$env:TARGET.zip" -Version "$env:CUSTOM_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed.' }

      - name: Check whether a previous release is downloadable
        id: previous
        run: |
          set -euo pipefail
          installer=install.sh
          if [[ "$RUNNER_OS" == Windows ]]; then installer=install.ps1; fi
          status=$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' \
            "https://github.com/SeventyfourSam/codex/releases/latest/download/$installer")
          case "$status" in
            200) echo 'available=true' >> "$GITHUB_OUTPUT" ;;
            404) echo '::notice::No downloadable previous release; local package installation tests still apply.' ;;
            *) echo "Unexpected installer HTTP status: $status" >&2; exit 1 ;;
          esac

      - name: Verify the built Windows CLI can update from GitHub
        if: runner.os == 'Windows' && steps.previous.outputs.available == 'true'
        shell: powershell
        run: |
          $originalPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'cli-update-home'
          $env:CODEX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'cli-update-bin'
          try {
            & ./package/bin/codex.exe update
            if ($LASTEXITCODE -ne 0) { throw 'The built codex update command failed.' }
            & (Join-Path $env:CODEX_INSTALL_DIR 'codex.exe') --custom
            if ($LASTEXITCODE -ne 0) { throw 'The updated CLI does not run.' }
          } finally { [Environment]::SetEnvironmentVariable('Path', $originalPath, 'User') }

      - name: Verify the built macOS CLI can update from GitHub
        if: runner.os == 'macOS' && steps.previous.outputs.available == 'true'
        run: |
          set -euo pipefail
          test_home=$(mktemp -d)
          trap 'rm -rf "$test_home"' EXIT
          HOME="$test_home" ZDOTDIR="$test_home" CODEX_HOME="$test_home/.codex" CODEX_INSTALL_DIR="$test_home/bin" ./package/bin/codex update
          "$test_home/bin/codex" --custom

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: custom-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: custom-*
          merge-multiple: true
          path: dist

      - name: Upload release archives and checksums
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          cp ../scripts/install/custom-install.sh install.sh
          cp ../scripts/install/custom-install.ps1 install.ps1
          sha256sum -- *.tar.gz *.zip install.sh install.ps1 > SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --clobber ./*.tar.gz ./*.zip install.sh install.ps1 SHA256SUMS
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest --title "Codex ${RELEASE_TAG#v}" \
              --notes "Custom CLI packages for macOS arm64 and Windows x64. Extract the complete archive and run the executable under bin/. Developer ID signing and notarization are not included." \
              ./*.tar.gz ./*.zip install.sh install.ps1 SHA256SUMS
          fi
